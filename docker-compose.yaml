# Basic Airflow configuration for LocalExecutor with PostgreSQL.
#
# WARNING: This configuration is for local development. Do not use it in a production deployment.
#
# This configuration supports basic configuration using environment variables or an .env file
# The following variables are supported:
#
# AIRFLOW_IMAGE_NAME         - Docker image name used to run Airflow.
#                              Default: apache/airflow:3.3.0
# AIRFLOW_UID                - User ID in Airflow containers
#                              Default: 50000
# AIRFLOW_JWT_SECRET         - Shared JWT signing secret for Airflow services.
# AIRFLOW_FERNET_KEY         - Optional Fernet key for encrypted values.
# AIRFLOW_ADMIN_USERNAME     - Username for the administrator account.
# AIRFLOW_ADMIN_PASSWORD     - Password for the administrator account.
# POSTGRES_USER              - PostgreSQL bootstrap administrator.
# POSTGRES_PASSWORD          - Password for the bootstrap administrator.
# POSTGRES_DB                - PostgreSQL maintenance database.
# AIRFLOW_DB_USER            - Owner of Airflow's metadata database.
# AIRFLOW_DB_PASSWORD        - Password for the Airflow metadata role.
# AIRFLOW_DB_NAME            - Airflow metadata database name.
# MARKET_DATA_DB             - Application database managed by Flyway.
# FLYWAY_USER                - PostgreSQL role used only for market-data migrations.
# FLYWAY_PASSWORD            - Password for the Flyway migration role.
# AIRFLOW_MARKET_DATA_PASSWORD - Password for Airflow's least-privilege market-data role.
# DASHBOARD_DB_PASSWORD      - Password for the dashboard's read-only Gold role.
# PGADMIN_DEFAULT_EMAIL      - Initial pgAdmin login email.
# PGADMIN_DEFAULT_PASSWORD   - Initial pgAdmin login password.
#
# Feel free to modify this file to suit your needs.
---
x-airflow-common:
  &airflow-common
  image: ${AIRFLOW_IMAGE_NAME}
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres/${AIRFLOW_DB_NAME}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__PARALLELISM: '4'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # DAGs use this connection for market data. The PostgreSQL metadata
    # credentials above must never be reused by pipeline code.
    AIRFLOW_CONN_MARKET_DATA: postgresql://market_data_airflow:${AIRFLOW_MARKET_DATA_PASSWORD}@postgres:5432/${MARKET_DATA_DB}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID}:0"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME}
      MARKET_DATA_DB: ${MARKET_DATA_DB}
      FLYWAY_USER: ${FLYWAY_USER}
      FLYWAY_PASSWORD: ${FLYWAY_PASSWORD}
      AIRFLOW_MARKET_DATA_PASSWORD: ${AIRFLOW_MARKET_DATA_PASSWORD}
      DASHBOARD_DB_PASSWORD: ${DASHBOARD_DB_PASSWORD}
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 5
    restart: always

  flyway:
    image: flyway/flyway:13.0.0
    profiles:
      - migration
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${MARKET_DATA_DB}
      FLYWAY_USER: ${FLYWAY_USER}
      FLYWAY_PASSWORD: ${FLYWAY_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: 10
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
      FLYWAY_BASELINE_ON_MIGRATE: "false"
      FLYWAY_CLEAN_DISABLED: "true"
    volumes:
      - ./sql/migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
      market-data-role-init:
        condition: service_completed_successfully

  # PostgreSQL only runs /docker-entrypoint-initdb.d for a brand-new volume.
  # This one-shot service also provisions/synchronizes application roles for
  # an existing development volume before Flyway applies grants.
  market-data-role-init:
    image: postgres:13
    profiles:
      - migration
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MARKET_DATA_DB: ${MARKET_DATA_DB}
      FLYWAY_USER: ${FLYWAY_USER}
      AIRFLOW_MARKET_DATA_PASSWORD: ${AIRFLOW_MARKET_DATA_PASSWORD}
      DASHBOARD_DB_PASSWORD: ${DASHBOARD_DB_PASSWORD}
    volumes:
      - ./postgres/provision:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/provision_market_data_roles.sh"]
    depends_on:
      postgres:
        condition: service_healthy
  
  pgadmin:
    image: dpage/pgadmin4:9.16
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_DISABLE_POSTFIX: 'true'
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: 'True'
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
  
  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - 8080:8080
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  dashboard:
    build:
      context: ./dashboard
    environment:
      MARKET_DATA_HOST: postgres
      MARKET_DATA_PORT: 5432
      MARKET_DATA_DB: ${MARKET_DATA_DB}
      MARKET_DATA_USER: market_data_dashboard
      MARKET_DATA_PASSWORD: ${DASHBOARD_DB_PASSWORD}
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    command:
      - bash
      - -c
      - |
        airflow version
        airflow pools set coinbase_trades_api 1 "Serialize Coinbase trades endpoint requests"
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      _AIRFLOW_WWW_USER_EMAIL: ${AIRFLOW_ADMIN_EMAIL}

volumes:
  postgres-db-volume:
  pgadmin-data:
